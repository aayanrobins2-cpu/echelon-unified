name: Build for cPanel
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: cpanel-build-main
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Download website fonts and build
        run: |
          node tools/fetch-fonts.mjs
          node build.js
        env:
          SITE_URL: https://bisechelon.in
      - name: Publish the successful build for cPanel
        run: |
          printf '%s\n' "$GITHUB_SHA" > .cpanel-ready
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html js/main.js .cpanel-ready
          git commit -m 'Build site for cPanel [skip ci]'
          git push origin HEAD:main
