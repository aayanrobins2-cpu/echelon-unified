# Publishes the site to GitHub Pages when manually run after Pages is configured.
#
# The Satoshi and Cabinet Grotesk font files are not stored in this repo: their
# licence (ITF Free Font License) allows using them on a website but not sharing
# the files on their own. So each deploy downloads them from Fontshare, builds
# the page, and publishes only what the site needs: index.html, js/ and assets/.
name: Deploy to GitHub Pages

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time; a newer push waits instead of cancelling a live deploy.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Download the fonts from Fontshare
        run: node tools/fetch-fonts.mjs

      - id: pages
        uses: actions/configure-pages@v6

      - name: Build index.html from content.json
        run: node build.js
        env:
          SITE_URL: ${{ steps.pages.outputs.base_url }}

      - name: Collect the files the site needs
        run: |
          mkdir _site
          cp index.html _site/
          cp -r js assets history _site/

      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v5
