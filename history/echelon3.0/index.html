    <!-- Custom Styles & Animation Configuration -->
    <style>
        body { font-family: 'Inter', sans-serif; }
        .font-mono { font-family: 'JetBrains Mono', monospace; }
        
        /* Custom Animations */
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0; }
        }
        
        /* GLITCH ANIMATION FOR MODAL TITLE */
        @keyframes glitch-anim {
            0% { 
                clip-path: polygon(0 2%, 100% 2%, 100% 5%, 0 5%);
                transform: translate(0);
            }
            20% { 
                clip-path: polygon(0 15%, 100% 15%, 100% 15%, 0 15%);
                transform: translate(-2px, 2px);
                color: #22d3ee; /* cyan-400 */
            }
            40% { 
                clip-path: polygon(0 10%, 100% 10%, 100% 20%, 0 20%);
                transform: translate(-2px, -2px);
            }
            60% { 
                clip-path: polygon(0 1%, 100% 1%, 100% 2%, 0 2%);
                transform: translate(2px, 2px);
                color: #ef4444; /* red-500 */
            }
            80% { 
                clip-path: polygon(0 33%, 100% 33%, 100% 33%, 0 33%);
                transform: translate(2px, -2px);
            }
            100% { 
                clip-path: polygon(0 0, 100% 0, 100% 100%, 0 100%);
                transform: translate(0);
                color: white;
            }
        }

        /* Circuit Pulse Animation */
        @keyframes circuit-pulse {
            0%, 100% { opacity: 0.3; stroke: #475569; }
            50% { opacity: 1; stroke: #22d3ee; }
        }
        .circuit-line { animation: circuit-pulse 3s infinite; }
        .circuit-line:nth-child(2) { animation-delay: 0.5s; }
        .circuit-line:nth-child(3) { animation-delay: 1s; }
        
        .animate-fade-in { animation: fadeIn 0.3s ease-out forwards; }
        .cursor-blink { animation: blink 1s step-end infinite; }
        .animate-glitch { animation: glitch-anim 0.4s cubic-bezier(.25, .46, .45, .94) both; }
        
        /* Grid Background Pattern */
        .bg-grid-pattern {
            background-image: linear-gradient(to right, #1e293b 1px, transparent 1px),
                              linear-gradient(to bottom, #1e293b 1px, transparent 1px);
            background-size: 40px 40px;
            mask-image: radial-gradient(circle at center top, black 20%, transparent 90%);
            -webkit-mask-image: radial-gradient(circle at center top, black 20%, transparent 90%);
        }

        /* Floating Particles Animation */
        @keyframes float-particle {
            0%, 100% { transform: translateY(0) scale(1); opacity: 0.3; }
            50% { transform: translateY(-15px) scale(1.1); opacity: 0.7; }
        }
        .particle { animation: float-particle 4s ease-in-out infinite; }
        .particle-delay-1 { animation-delay: 1s; }
        .particle-delay-2 { animation-delay: 2s; }
        .particle-delay-3 { animation-delay: 3s; }

        /* Pulse Ring for Plug */
        @keyframes plug-pulse {
            0% { transform: scale(1); opacity: 0.5; }
            100% { transform: scale(1.5); opacity: 0; }
        }
        .plug-ring { animation: plug-pulse 2s cubic-bezier(0, 0, 0.2, 1) infinite; }

        /* Holographic Panel Styles */
        .holo-panel {
            background: rgba(15, 23, 42, 0.6);
            backdrop-filter: blur(8px);
            border: 1px solid rgba(34, 211, 238, 0.2);
            box-shadow: 0 0 15px rgba(34, 211, 238, 0.1);
        }
        .holo-panel::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0; height: 1px;
            background: linear-gradient(90deg, transparent, rgba(34, 211, 238, 0.5), transparent);
        }

        /* Scrollbar styling */
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: #020617; }
        ::-webkit-scrollbar-thumb { background: #334155; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #475569; }

        /* Modal Transitions */
        #event-modal { transition: opacity 0.2s ease-in-out, backdrop-filter 0.2s; }
        #event-modal.hidden { opacity: 0; pointer-events: none; display: none; }
        #event-modal:not(.hidden) { opacity: 1; pointer-events: auto; display: flex; }

        /* --- INTRO SEQUENCE STYLES --- */
        #intro-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: #000;
            z-index: 100;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            font-family: 'JetBrains Mono', monospace;
            overflow: hidden;
            /* Ensure smooth fade out */
            transition: opacity 0.8s ease-out, transform 0.8s ease-in;
        }

        /* Matrix Canvas */
        #matrix-canvas {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            opacity: 0;
            transition: opacity 0.2s ease-in;
        }

        /* Matrix Glitch Effect for Intro Text */
        .matrix-glitch {
            position: relative;
            color: #0f0; /* Matrix Green */
            animation: matrix-shake 0.2s infinite;
        }
        .matrix-glitch::before, .matrix-glitch::after {
            content: attr(data-text);
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: #000;
            opacity: 0.8;
        }
        .matrix-glitch::before {
            left: 2px;
            text-shadow: -1px 0 #fff; /* White flash */
            clip: rect(44px, 450px, 56px, 0);
            animation: matrix-glitch-anim 2s infinite linear alternate-reverse;
        }
        .matrix-glitch::after {
            left: -2px;
            text-shadow: -1px 0 #003300; /* Dark Green shadow */
            clip: rect(44px, 450px, 56px, 0);
            animation: matrix-glitch-anim2 2s infinite linear alternate-reverse;
        }

        /* Scanline Overlay for Intro */
        .scanlines {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: linear-gradient(to bottom, rgba(255,255,255,0), rgba(255,255,255,0) 50%, rgba(0,0,0,0.2) 50%, rgba(0,0,0,0.2));
            background-size: 100% 4px;
            pointer-events: none;
            z-index: 101;
            opacity: 0.3;
        }

        @keyframes matrix-shake {
            0% { transform: translate(1px, 1px) rotate(0deg); }
            10% { transform: translate(-1px, -2px) rotate(-1deg); }
            20% { transform: translate(-3px, 0px) rotate(1deg); }
            30% { transform: translate(3px, 2px) rotate(0deg); }
            40% { transform: translate(1px, -1px) rotate(1deg); }
            50% { transform: translate(-1px, 2px) rotate(-1deg); }
            60% { transform: translate(-3px, 1px) rotate(0deg); }
            70% { transform: translate(3px, 1px) rotate(-1deg); }
            80% { transform: translate(-1px, -1px) rotate(1deg); }
            90% { transform: translate(1px, 2px) rotate(0deg); }
            100% { transform: translate(1px, -2px) rotate(-1deg); }
        }
        @keyframes matrix-glitch-anim {
            0% { clip: rect(10px, 9999px, 30px, 0); }
            20% { clip: rect(50px, 9999px, 60px, 0); }
            40% { clip: rect(20px, 9999px, 80px, 0); }
            60% { clip: rect(90px, 9999px, 10px, 0); }
            80% { clip: rect(40px, 9999px, 70px, 0); }
            100% { clip: rect(60px, 9999px, 30px, 0); }
        }
        @keyframes matrix-glitch-anim2 {
            0% { clip: rect(30px, 9999px, 10px, 0); }

            40% { clip: rect(10px, 9999px, 50px, 0); }
            60% { clip: rect(70px, 9999px, 20px, 0); }
            80% { clip: rect(20px, 9999px, 60px, 0); }
            100% { clip: rect(50px, 9999px, 40px, 0); }
        }
    </style>

            clearInterval(typewriterInterval); 

            typewriterInterval = setInterval(() => {

                    document.getElementById("hours").innerText = "00";
                    document.getElementById("minutes").innerText = "00";
                    document.getElementById("seconds").innerText = "00";

                const hours = Math.floor((distance % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
                const minutes = Math.floor((distance % (1000 * 60 * 60)) / (1000 * 60));
                const seconds = Math.floor((distance % (1000 * 60)) / 1000);

                const daysEl = document.getElementById("days");
                const hoursEl = document.getElementById("hours");
                const minsEl = document.getElementById("minutes");

        // --- INTRO SEQUENCE LOGIC ---
        function playIntroSequence() {
            const overlay = document.getElementById('intro-overlay');
            const consoleOutput = document.getElementById('console-output');
            const titleContainer = document.getElementById('intro-title-container');
            const text1 = document.getElementById('intro-text-1');
            const text2 = document.getElementById('intro-text-2');
            const appContainer = document.getElementById('app-container');
            const matrixCanvas = document.getElementById('matrix-canvas');

            // --- MATRIX RAIN SETUP ---
            const ctx = matrixCanvas.getContext('2d');
            matrixCanvas.width = window.innerWidth;
            matrixCanvas.height = window.innerHeight;

            const katakana = 'アァカサタナハマヤャラワガザダバパイィキシチニヒミリヰギジヂビピウゥクスツヌフムユュルグズブヅプエェケセテネヘメレヱゲゼデベペオォコソトノホモヨョロヲゴゾドボポヴッン';
            const latin = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ';
            const nums = '0123456789';
            const alphabet = katakana + latin + nums;

            const fontSize = 16;
            const columns = matrixCanvas.width/fontSize;
            const drops = [];

            for(let x = 0; x < columns; x++)
                drops[x] = 1;

            function drawMatrix() {
                ctx.fillStyle = 'rgba(0, 0, 0, 0.05)';
                ctx.fillRect(0, 0, matrixCanvas.width, matrixCanvas.height);
                
                ctx.fillStyle = '#0F0'; // Matrix Green
                ctx.font = fontSize + 'px monospace';

                for(let i = 0; i < drops.length; i++) {
                    const text = alphabet.charAt(Math.floor(Math.random() * alphabet.length));
                    ctx.fillText(text, i*fontSize, drops[i]*fontSize);
                    if(drops[i]*fontSize > matrixCanvas.height && Math.random() > 0.975)
                        drops[i] = 0;
                    drops[i]++;
                }
            }
            let matrixInterval;

            // --- TYPEWRITER HELPER ---
            function typeText(element, text, speed, callback) {
                element.innerHTML = ""; // Clear existing content for the element
                let i = 0;
                element.style.borderRight = "2px solid #22d3ee"; // Cursor
                
                const interval = setInterval(() => {
                    if (i < text.length) {
                        element.innerHTML += text.charAt(i);
                        i++;
                    } else {
                        clearInterval(interval);
                        element.style.borderRight = "none";
                        if (callback) callback();
                    }
                }, speed);
            }

            // Phase 1: Console Logs with REAL Typing
            const consoleSteps = [
                "> SYSTEM.INIT(0x45)", 
                "> ESTABLISHING SECURE CONNECTION...", 
                "> ACCESS GRANTED."
            ];

            function runConsoleSequence(index) {
                if (index >= consoleSteps.length) {
                    // Console done, start Main Title
                    setTimeout(() => {
                        consoleOutput.style.display = 'none';
                        titleContainer.classList.remove('hidden');
                        
                        typeText(text1, "BANGALORE INTERNATIONAL SCHOOL", 40, () => {
                            setTimeout(() => {
                                typeText(text2, "PRESENTS", 50, () => {
                                    triggerMatrixGlitch();
                                });
                            }, 300);
                        });
                    }, 500);
                    return;
                }
                
                // Clear and type the new line (simulates rapid log update)
                typeText(consoleOutput, consoleSteps[index], 30, () => {
                    setTimeout(() => {
                        runConsoleSequence(index + 1);
                    }, 400); 
                });
            }

            // Start the sequence
            runConsoleSequence(0);

            function triggerMatrixGlitch() {
                setTimeout(() => {
                    // Start Matrix Rain
                    matrixCanvas.style.opacity = '0.3';
                    matrixInterval = setInterval(drawMatrix, 30);

                    // Glitch the Text
                    text1.classList.add('matrix-glitch');
                    text1.setAttribute('data-text', "BANGALORE INTERNATIONAL SCHOOL");
                    text1.style.color = '#0f0'; // Turn text green
                    
                    text2.classList.add('matrix-glitch');
                    text2.setAttribute('data-text', "PRESENTS");
                    text2.style.color = '#0f0';

                    // Phase 4: Smooth Fade Out (No more double flash)
                    setTimeout(() => {
                        // Smoothly zoom and fade only the OVERLAY
                        overlay.style.transition = 'opacity 0.8s ease-out, transform 0.8s ease-in';
                        overlay.style.opacity = '0';
                        overlay.style.transform = 'scale(1.2)'; // Zoom THROUGH the overlay
                        
                        // Main content stays stable underneath
                        document.body.style.overflow = 'auto';

                        setTimeout(() => {
                            overlay.style.display = 'none';
                            clearInterval(matrixInterval);
                        }, 800); // Match transition duration

                    }, 1500); // Glitch duration

                }, 500);
            }
        }

        // Initialize content directly (Renders BEHIND the overlay immediately)
        renderContent();
        // CALL ICONS IMMEDIATELY ON LOAD
        lucide.createIcons();

        // Start Intro on Load
        window.addEventListener('load', () => {
            lucide.createIcons(); // Double check icons are rendered
            playIntroSequence();
        });

    </script>
